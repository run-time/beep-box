<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Beep Box Level Maker</title>
    <style>
      body {
        font-family: sans-serif;
        margin: 2em;
      }

      .song-container {
        display: flex;
        flex-direction: column;
        width: 100%;
        margin: 0 auto;
        margin-bottom: 16px;
      }

      .song-modes {
        margin-bottom: 0.5em;
        width: 100%;
      }

      .song-text {
        width: 100%;
        height: 12em;
        min-height: 8em;
        resize: vertical;
        box-sizing: border-box;
        font-family: monospace;
        font-size: 1em;
        margin: 0;
        padding: 8px;
        border-top: 4px solid #ccc;
        border-bottom: 1px dotted #aaa;
      }

      .song-status {
        width: 100%;
        background: #fafbfc;
        box-sizing: border-box;
        margin: 0;
        padding: 0.5em 0.75em;
        font-size: 0.95em;
        border-bottom: 4px solid #ccc;
      }

      .song-text,
      .song-status {
        border-left: 4px solid #ccc;
        border-right: 4px solid #ccc;
      }

      @media (max-width: 600px) {
        .song-container {
          max-width: 100%;
          padding: 0 0.5em;
        }
      }
      button {
        padding: 0.5em 1em;
      }

      .controls {
        margin-bottom: 1em;
      }

      .effects-container {
        display: inline-block;
      }

      .bold-label {
        font-weight: 600;
      }

      .modifier-row {
        margin-top: 0.75em;
        display: flex;
        align-items: center;
        gap: 0.5em;
      }

      #gameArea {
        background: #111;
        color: #fff;
        border-top: 2px solid #333;
        padding: 12px 16px;
        margin-top: 8px;
        box-sizing: border-box;
        z-index: 10;
      }

      #gameAreaInner {
        width: 100%;
        height: auto;
        display: grid;
        grid-template-columns: 1fr 100%;
        gap: 16px;
        align-items: stretch;
      }

      #lanePreview {
        width: 400px;
        height: 300px;
        border: 4px solid #444;
        border-radius: 8px;
        position: relative;
        overflow: hidden;
        background:
          linear-gradient(#222, #222) padding-box,
          radial-gradient(
            circle at 20% 20%,
            rgba(255, 255, 255, 0.08),
            transparent 50%
          ),
          radial-gradient(
            circle at 80% 80%,
            rgba(255, 255, 255, 0.06),
            transparent 55%
          );
      }

      .previewDot {
        width: 16px;
        height: 16px;
        border-radius: 12px;
        position: absolute;
        transform: translate(-50%, -50%);
        border: 2px solid rgba(255, 255, 255, 0.75);
        box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.3);
      }

      .previewTarget {
        width: 24px;
        height: 24px;
        left: 50%;
        top: 50%;
        border-radius: 0;
        border-width: 4px;
        opacity: 0.7;
      }

      #laneInfo {
        margin-top: 8px;
        font-size: 12px;
        color: #ccc;
      }

      #gameCanvas {
        display: block;
        border: 4px solid #444;
        border-radius: 8px;
        background: #1b1b1b;
      }

      #laneButtons {
        display: grid;
        grid-template-columns: repeat(4, 44px);
        gap: 8px;
        justify-content: end;
      }

      .laneBtn {
        margin-top: 0;
        width: 44px;
        height: 44px;
        padding: 0;
        font-size: 12px;
        border-radius: 8px;
        border: 1px solid #444;
        background: #1a1a1a;
        color: #fff;
        cursor: pointer;
      }

      .laneBtn.wide {
        width: auto;
        grid-column: 1 / -1;
        height: 40px;
        padding: 0 10px;
        justify-self: stretch;
      }

      .laneBtn.active {
        outline: 2px solid #fff;
        border-color: #fff;
      }

      .laneBtn.up {
        background: #5a1010;
      }

      .laneBtn.left {
        background: #5a4b10;
      }

      .laneBtn.right {
        background: #10305a;
      }

      .laneBtn.down {
        background: #0f4a1b;
      }

      .laneBtn.mid {
        background: #3a3a3a;
      }

      .laneBtn.none {
        background: #222;
      }

      #applyInstrumentBtn {
        margin-top: 0;
        height: 24px;
        padding: 0 8px;
      }
      .controls details,
      body > details {
        margin-top: 0.75em;
      }
      summary {
        cursor: pointer;
        font-weight: 600;
        user-select: none;
      }
      .fx-stepper {
        display: inline-flex;
        align-items: center;
        gap: 0.25em;
      }
      .fx-step-btn {
        width: 24px;
        height: 24px;
        padding: 0;
        line-height: 1;
      }
      .playing-status {
        cursor: pointer;
        display: inline-block;
        font-size: 0.8rem;
        margin-top: 6px;
      }
      .playing-status-row {
        font-family: monospace;
        font-size: 0.7rem;
        padding: 2px 4px;
        background: #eee;
      }

      input,
      select {
        padding: 4px 6px;
      }

      .modifier-container {
        margin-left: 16px;
      }
    </style>
  </head>

  <body>
    <h1 id="mainHeader">Beep Box Level Maker</h1>

    <div class="song-container">
      <div id="modeControls" class="song-modes">
        <label style="margin-right: 1em"

    <div class="controls">

    <details>
      <summary>Instruments</summary>

    <details>

    <script src="https://unpkg.com/tone@next/build/Tone.js"></script>
    <script src="https://nbrosowsky.github.io/tonejs-instruments/Tonejs-Instruments.js"></script>

    <script type="module">
      import {
        sortAndFormatNotesTable,
        midiToFreq,
        gatherSongMetadata,
        parseInput,
        normalizeStartTimes,
        insertNotesForChords,
        clearInsertedNotes
      } from "./note-utils.js";

      import { NotePlayback, midiToNoteName } from "../playback.js";
      import { parseSongEffectsFromMarkdown } from "../levels/markdown-song.js";
      import { drawGameFrame } from "./render-game.js";

      function applyInstrumentToTrack() {
        const textarea = document.getElementById("noteInput");
        const trackNum = parseInt(
          document.getElementById("instrumentTrackInput").value,
          10
        );
        const instrument = document.getElementById("instrumentSelect").value;
        if (!Number.isFinite(trackNum) || !instrument) return;
        const lines = textarea.value.split(/\r?\n/);
        const newLines = lines.map((line) => {
          const cols = line
            .replace(/^\||\|$/g, "")
            .split("|")
            .map((s) => s.trim());
          if (cols.length < 3) return line;
          if (parseInt(cols[0], 10) !== trackNum) return line;
          if (cols.length < 9) return line;
          cols[1] = instrument;
          return "| " + cols.join(" | ") + " |";
        });
        textarea.value = newLines.join("\n");
        // Optionally, update state/UI
        pausePlayback();
        playbackNotes = [];
        playState.status = "stopped";
        playState.hasPreloaded = false;
        playState.cursor = {
          lastNoteIdx: null,
          lastChordIdx: null,
          lastLineIdx: null,
          nextStartTime: 0
        };
        playback.clearScheduledTimeouts();
        document.getElementById("currentRowStatus").innerHTML = "";
        currentNoteIdx = 0;
        currentChordIdx = 0;
        updateNavButtons();
        updateMetadataAndHeader();
        updateOctaveButtons();
        renderLaneUIForSelectedLine();
      }

      // --- Octave shift and button enable/disable logic ---
      function updateOctaveButtons() {
        const textarea = document.getElementById("noteInput");
        const lines = textarea.value.split(/\r?\n/);
        const amtEl = document.getElementById("transposeAmount");
        let delta = parseInt(amtEl?.value ?? "12", 10);
        if (!Number.isFinite(delta)) delta = 12;
        delta = Math.max(1, Math.min(12, delta));
        if (amtEl) amtEl.value = String(delta);

        let minKey = Infinity;
        let maxKey = -Infinity;
        for (const line of lines) {
          const cols = line
            .replace(/^\||\|$/g, "")
            .split("|")
            .map((s) => s.trim());
          if (cols.length < 3) continue;
          const isSplit =
            cols.length >= 4 &&
            cols[1] &&
            !cols[1].startsWith("note_") &&
            /^\d+$/.test(cols[2] || "") &&
            /^\d+$/.test(cols[3] || "");
          const keyIdx = isSplit ? 3 : 2;
          if (!/^\d+$/.test(cols[keyIdx] || "")) continue;
          const key = parseInt(cols[keyIdx], 10);
          if (!Number.isFinite(key)) continue;
          minKey = Math.min(minKey, key);
          maxKey = Math.max(maxKey, key);
        }
        const hasAny = minKey !== Infinity && maxKey !== -Infinity;
        document.getElementById("lowerBtn").disabled =
          !hasAny || minKey - delta < 21;
        document.getElementById("higherBtn").disabled =
          !hasAny || maxKey + delta > 108;
      }

      function shiftAllNotesOctave(delta) {
        const textarea = document.getElementById("noteInput");
        const lines = textarea.value.split(/\r?\n/);
        const newLines = lines.map((line) => {
          const cols = line
            .replace(/^\||\|$/g, "")
            .split("|")
            .map((s) => s.trim());
          if (cols.length < 3) return line;
          const isSplit =
            cols.length >= 4 &&
            cols[1] &&
            !cols[1].startsWith("note_") &&
            /^\d+$/.test(cols[2] || "") &&
            /^\d+$/.test(cols[3] || "");
          const keyIdx = isSplit ? 3 : 2;
          const nameIdx = isSplit ? 4 : 3;
          if (!/^\d+$/.test(cols[keyIdx] || "")) return line;
          let key = parseInt(cols[keyIdx], 10) + delta;
          key = Math.max(21, Math.min(108, key));
          cols[keyIdx] = key.toString();
          const noteName = midiToNoteName(key);
          if (noteName) cols[nameIdx] = noteName;
          return "| " + cols.join(" | ") + " |";
        });
        textarea.value = newLines.join("\n");
        pausePlayback();
        playbackNotes = [];
        playState.status = "stopped";
        playState.hasPreloaded = false;
        playState.cursor = {
          lastNoteIdx: null,
          lastChordIdx: null,
          lastLineIdx: null,
          nextStartTime: 0
        };
        playback.clearScheduledTimeouts();
        document.getElementById("currentRowStatus").innerHTML = "";
        currentNoteIdx = 0;
        currentChordIdx = 0;
        updateNavButtons();
        updateMetadataAndHeader();
        updateOctaveButtons();
      }

      function getTransposeDelta() {
        const amtEl = document.getElementById("transposeAmount");
        let delta = parseInt(amtEl?.value ?? "12", 10);
        if (!Number.isFinite(delta)) delta = 12;
        return Math.max(1, Math.min(12, delta));
      }

      document.getElementById("higherBtn").addEventListener("click", () => {
        shiftAllNotesOctave(getTransposeDelta());
      });
      document.getElementById("lowerBtn").addEventListener("click", () => {
        shiftAllNotesOctave(-getTransposeDelta());
      });

      document
        .getElementById("noteInput")
        .addEventListener("input", updateOctaveButtons);
      document
        .getElementById("transposeAmount")
        .addEventListener("input", updateOctaveButtons);
      window.addEventListener("DOMContentLoaded", updateOctaveButtons);

      // State
      let rowLineMap = [];
      let noteLineMap = [];
      let currentNoteIdx = 0;
      let playbackNotes = [];
      let chordStartIndices = [];
      let currentChordIdx = 0;
      let chordIndexByStartNoteIdx = new Map();
      const playState = {
        status: "stopped", // 'stopped' | 'playing' | 'paused'
        hasPreloaded: false,
        seekWhilePaused: false,
        cursor: {
          lastNoteIdx: null,
          lastChordIdx: null,
          lastLineIdx: null,
          nextStartTime: 0
        }
      };
      let isSnappingSelection = false;
      let parseDebounceTimer = null;
      let suppressSelectionAutoPlayUntilTs = 0;
      const playback = new NotePlayback();
      const DELAY_64TH_MIN = 1;
      const DELAY_64TH_MAX = 128; // 2 whole notes in 4/4

      function getDelay64thCount() {
        const raw = Math.floor(num("delayTime"));
        return Math.max(DELAY_64TH_MIN, Math.min(DELAY_64TH_MAX, raw));
      }

      function delay64thToSeconds(delay64ths) {
        const tone = window?.Tone;
        if (tone?.Time) {
          try {
            return delay64ths * tone.Time("64n").toSeconds();
          } catch {
            // Fallback below.
          }
        }
        // Fallback at 120 BPM: quarter = 0.5s, 64th = 0.03125s.
        return delay64ths * 0.03125;
      }

      function formatDelay64thLabel(delay64ths) {
        if (delay64ths % 64 === 0) return `${delay64ths / 64} whole`;
        if (delay64ths % 32 === 0) return `${delay64ths / 32}/2`;
        if (delay64ths % 16 === 0) return `${delay64ths / 16}/4`;
        if (delay64ths % 8 === 0) return `${delay64ths / 8}/8`;
        if (delay64ths % 4 === 0) return `${delay64ths / 4}/16`;
        if (delay64ths % 2 === 0) return `${delay64ths / 2}/32`;
        return `${delay64ths}/64`;
      }

      function num(id) {
        return Number(document.getElementById(id)?.value ?? 0);
      }

      function checked(id) {
        return Boolean(document.getElementById(id)?.checked);
      }

      function effectsEnabledInPlayback() {
        return checked("enablePlaybackEffects");
      }

      function mergeEffectObjects(base, overlay) {
        const out = JSON.parse(JSON.stringify(base || {}));
        const src = overlay || {};
        if (src.release !== undefined) out.release = src.release;
        if (src.reverb) out.reverb = { ...(out.reverb || {}), ...src.reverb };
        if (src.filter) out.filter = { ...(out.filter || {}), ...src.filter };
        if (src.delay) out.delay = { ...(out.delay || {}), ...src.delay };
        if (src.lowpass?.enabled) {
          out.filter = {
            ...(out.filter || {}),
            type: "lowpass",
            frequency: src.lowpass.frequency
          };
        }
        return out;
      }

      function parseBaseEffectsFromTextarea(text) {
        return parseSongEffectsFromMarkdown(text) || {};
      }

      function getPlaybackEffectsForCurrentSong() {
        const text = document.getElementById("noteInput").value;
        const baseFromTable = parseBaseEffectsFromTextarea(text);
        if (!effectsEnabledInPlayback()) return baseFromTable;
        const overlay = getEffectsFromControls();
        return mergeEffectObjects(baseFromTable, overlay);
      }

      function getEffectsFromControls() {
        const delay64ths = getDelay64thCount();
        const eqEnabled =
          checked("fxEqEnabled") ||
          checked("fxEqMidEnabled") ||
          checked("fxEqLowEnabled");
        return {
          release: num("release"),
          reverb: {
            enabled:
              checked("fxReverbEnabled") || checked("fxReverbWetEnabled"),
            decay: num("reverbDecay"),
            wet: num("reverbWet"),
            preDelay: 0.03
          },
          delay: {
            enabled:
              checked("fxDelayEnabled") ||
              checked("fxDelayFeedbackEnabled") ||
              checked("fxDelayWetEnabled"),
            time: delay64thToSeconds(delay64ths),
            feedback: num("delayFeedback"),
            wet: num("delayWet")
          },
          eq: {
            enabled: eqEnabled,
            high: num("high"),
            mid: num("mid"),
            low: num("low")
          },
          lowpass: {
            enabled: checked("fxLowpassEnabled"),
            frequency: num("lowpassFrequency")
          },
          chorus: {
            enabled: checked("fxChorusEnabled"),
            depth: num("chorusDepth"),
            frequency: 1.5,
            delayTime: 2.5,
            wet: 0.16
          },
          distortion: {
            enabled: checked("fxDistortionEnabled"),
            amount: num("distortionAmount"),
            wet: 0.15
          }
        };
      }

      function updateEffectValueLabels() {
        const delay64ths = getDelay64thCount();
        document.getElementById("releaseVal").textContent =
          num("release").toFixed(1);
        document.getElementById("reverbDecayVal").textContent =
          num("reverbDecay").toFixed(1);
        document.getElementById("reverbWetVal").textContent =
          num("reverbWet").toFixed(2);
        document.getElementById("delayTimeVal").textContent =
          formatDelay64thLabel(delay64ths);
        document.getElementById("delayFeedbackVal").textContent =
          num("delayFeedback").toFixed(2);
        document.getElementById("delayWetVal").textContent =
          num("delayWet").toFixed(2);
        document.getElementById("highVal").textContent = num("high").toFixed(1);
        document.getElementById("midVal").textContent = num("mid").toFixed(1);
        document.getElementById("lowVal").textContent = num("low").toFixed(1);
        document.getElementById("lowpassFrequencyVal").textContent = String(
          Math.round(num("lowpassFrequency"))
        );
        document.getElementById("chorusDepthVal").textContent =
          num("chorusDepth").toFixed(2);
        document.getElementById("distortionAmountVal").textContent =
          num("distortionAmount").toFixed(2);
      }

      function enabledEffectRowsForInsert() {
        const rows = [];
        const fx = getEffectsFromControls();
        if (checked("fxReleaseEnabled")) {
          rows.push(`| sfx | release | amount | ${fx.release.toFixed(1)} |`);
        }
        if (fx.reverb.enabled) {
          rows.push(
            `| sfx | reverb | decay | ${fx.reverb.decay.toFixed(2)} | wet | ${fx.reverb.wet.toFixed(2)} | preDelay | ${fx.reverb.preDelay.toFixed(2)} |`
          );
        }
        if (fx.delay.enabled) {
          rows.push(
            `| sfx | delay | time | ${fx.delay.time.toFixed(3)} | feedback | ${fx.delay.feedback.toFixed(2)} | wet | ${fx.delay.wet.toFixed(2)} |`
          );
        }
        if (fx.lowpass.enabled) {
          rows.push(
            `| sfx | lowpass | frequency | ${Math.round(fx.lowpass.frequency)} |`
          );
        }
        if (fx.eq.enabled) {
          rows.push(
            `| sfx | eq | high | ${fx.eq.high.toFixed(1)} | mid | ${fx.eq.mid.toFixed(1)} | low | ${fx.eq.low.toFixed(1)} |`
          );
        }
        if (fx.chorus.enabled) {
          rows.push(
            `| sfx | chorus | depth | ${fx.chorus.depth.toFixed(2)} |`
          );
        }
        if (fx.distortion.enabled) {
          rows.push(
            `| sfx | distortion | amount | ${fx.distortion.amount.toFixed(2)} |`
          );
        }
        return rows;
      }

      function insertEffectsAtCursor() {
        const textarea = document.getElementById("noteInput");
        const rows = enabledEffectRowsForInsert();
        if (!rows.length) return;
        const insertion = rows.join("\n") + "\n";
        const start = textarea.selectionStart ?? 0;
        const end = textarea.selectionEnd ?? 0;
        textarea.value =
          textarea.value.slice(0, start) +
          insertion +
          textarea.value.slice(end);
        textarea.focus();
        const nextPos = start + insertion.length;
        textarea.setSelectionRange(nextPos, nextPos);
        textarea.dispatchEvent(new Event("input", { bubbles: true }));
      }

      function resetEffectsControls() {
        document.getElementById("enablePlaybackEffects").checked = false;
        document.getElementById("fxReleaseEnabled").checked = true;
        document.getElementById("release").value = "3.5";
        document.getElementById("fxReverbEnabled").checked = true;
        document.getElementById("fxReverbWetEnabled").checked = true;
        document.getElementById("reverbDecay").value = "5.5";
        document.getElementById("reverbWet").value = "0.38";
        document.getElementById("fxDelayEnabled").checked = false;
        document.getElementById("fxDelayFeedbackEnabled").checked = false;
        document.getElementById("fxDelayWetEnabled").checked = false;
        document.getElementById("delayTime").value = "8";
        document.getElementById("delayFeedback").value = "0.22";
        document.getElementById("delayWet").value = "0.12";
        document.getElementById("fxEqEnabled").checked = false;
        document.getElementById("fxEqMidEnabled").checked = false;
        document.getElementById("fxEqLowEnabled").checked = false;
        document.getElementById("high").value = "3";
        document.getElementById("mid").value = "1";
        document.getElementById("low").value = "-2";
        document.getElementById("fxLowpassEnabled").checked = false;
        document.getElementById("lowpassFrequency").value = "1400";
        document.getElementById("fxChorusEnabled").checked = false;
        document.getElementById("chorusDepth").value = "0.3";
        document.getElementById("fxDistortionEnabled").checked = false;
        document.getElementById("distortionAmount").value = "0.08";
        updateEffectValueLabels();

      }

      async function playNoteCompat(note) {
        if (typeof playback.triggerNote === "function") {
          await playback.triggerNote(note);
          return;
        }
        // Backward-compat fallback if an older cached playback.js is loaded.
        await playback.loadPiano();
        const name = midiToNoteName(note?.midi);
        if (!name || !playback.sampler) return;
        playback.sampler.triggerAttackRelease(name, note.duration);
      }

      // UI helpers
      function updateMetadataAndHeader() {
        const textarea = document.getElementById("noteInput");
        const meta = gatherSongMetadata(textarea.value);
        const metaDiv = document.getElementById("metadataArea");
        metaDiv.innerHTML = `<b>Notes:</b> ${meta.noteCount} &nbsp; <b>Chords:</b> ${meta.chordCount} &nbsp; <b>Tracks:</b> ${meta.trackCount} &nbsp; <b>Duration:</b> ${meta.duration.toFixed(2)}s`;
        // Update header with current position
        const header = document.getElementById("mainHeader");
        const chordMode = document.getElementById("chordMode").checked;
        let title = "Beep Box Level Maker";
        if (chordMode && chordStartIndices.length > 0) {
          let total = chordStartIndices.length;
          let pos = currentChordIdx + 1;
          if (total === 0) {
            header.textContent = "Beep Box Level Maker";
          } else {
            title = `Beep Box Level Maker - Chord ${pos} of ${total}`;
            header.textContent = title;
          }
        } else {
          let total = meta.noteCount;
          let pos = currentNoteIdx + 1;
          if (total === 0) {
            header.textContent = "Beep Box Level Maker";
          } else {
            title = `Beep Box Level Maker - ${pos} of ${total}`;
            header.textContent = title;
          }
        }
        document.title = title;
      }

      function renderCurrentRowStatus(noteIdx) {
        if (
          !Number.isFinite(noteIdx) ||
          noteIdx < 0 ||
          noteIdx >= playbackNotes.length
        )
          return;
        const note = playbackNotes[noteIdx];
        if (!note) return;
        const currentRowDiv = document.getElementById("currentRowStatus");
        if (!currentRowDiv) return;
        const chordIdx = chordIndexByStartNoteIdx.get(noteIdx);
        const chordDisplayIdx =
          chordIdx !== undefined && chordIdx !== null ? chordIdx + 1 : null;
        const noteDisplayIdx = noteIdx + 1;
        const prefix =
          chordDisplayIdx != null
            ? `Chord ${chordDisplayIdx} Note ${noteDisplayIdx}`
            : `Note ${noteDisplayIdx}`;
        currentRowDiv.innerHTML = "";
        const div = document.createElement("div");
        div.className = "playing-status";
        div.innerHTML = `<strong>Playing:</strong> ${prefix}  <span class="playing-status-row">${note.raw}</span>`;
        div.onclick = async () => {
          const chordMode = document.getElementById("chordMode").checked;
          await selectNoteAt(noteIdx, true, chordMode);
        };
        currentRowDiv.appendChild(div);
      }

      async function selectNoteAt(idx, play = false, chordModeOverride = null) {
        const textarea = document.getElementById("noteInput");
        const lines = textarea.value.split(/\r?\n/);
        if (!noteLineMap.length) return;
        idx = Math.max(0, Math.min(noteLineMap.length - 1, idx));
        let lineIdx = noteLineMap[idx];
        let startIdx = 0;
        for (let i = 0; i < lineIdx; ++i) startIdx += lines[i].length + 1;
        textarea.focus();
        textarea.setSelectionRange(startIdx, startIdx + lines[lineIdx].length);
        // Scroll textarea to make selection visible (centered).
        scrollTextareaToLine(textarea, lineIdx);
        currentNoteIdx = idx;
        // Update currentChordIdx if in chord mode
        const chordMode =
          chordModeOverride !== null
            ? chordModeOverride
            : document.getElementById("chordMode").checked;
        if (chordMode && chordStartIndices.length > 0) {
          currentChordIdx = chordStartIndices.findIndex((i) => i === idx);
        }
        updateMetadataAndHeader();
        updateNavButtons();
        renderLaneUIForSelectedLine();
        renderCurrentRowStatus(currentNoteIdx);
        if (play && playbackNotes.length) {
          if (chordMode) {
            // Play all notes at the same start time as the selected note
            const chordTime = playbackNotes[idx].start;
            const chordNotes = playbackNotes.filter(
              (n) => n.start === chordTime
            );
            await playback.preloadNotes(chordNotes);
            await new Promise((res) => setTimeout(res, 100));
            for (const note of chordNotes) {
              await playNoteCompat(note);
            }
          } else {
            await playback.preloadNotes([playbackNotes[idx]]);
            await new Promise((res) => setTimeout(res, 100));
            await playNoteCompat(playbackNotes[idx]);
          }
        }
      }

      function updateNavButtons() {
        if (
          !noteLineMap.length &&
          document.getElementById("noteInput").value.trim().length > 0
        ) {
          // Keep nav responsive after paste even before first play.
          ensureParsedFromTextarea();
        }
        const chordMode = document.getElementById("chordMode").checked;
        if (chordMode && chordStartIndices.length > 0) {
          document.getElementById("prevBtn").disabled = currentChordIdx <= 0;
          document.getElementById("nextBtn").disabled =
            currentChordIdx >= chordStartIndices.length - 1;
        } else {
          document.getElementById("prevBtn").disabled = currentNoteIdx <= 0;
          document.getElementById("nextBtn").disabled =
            currentNoteIdx >= noteLineMap.length - 1;
        }
      }

      function getSelectedLineContext() {
        const textarea = document.getElementById("noteInput");
        const text = textarea.value;
        const caret = textarea.selectionStart ?? 0;
        const { start, end } = getLineBoundsFromCharIndex(text, caret);
        const lineIdx = getLineIndexFromCharIndex(text, start);
        const line = text.slice(start, end);
        return { textarea, text, start, end, lineIdx, line };
      }

      function parseTableLine(line) {
        const cols = line
          .replace(/^\||\|$/g, "")
          .split("|")
          .map((s) => s.trim());
        return cols;
      }

      function formatTableLine(cols) {
        return "| " + cols.join(" | ") + " |";
      }

      function getLaneFromLine(line) {
        const cols = parseTableLine(line);
        const lane = parseInt(cols[2] || "0", 10);
        return Number.isFinite(lane) ? lane : 0;
      }

      function setSelectedRowLane(laneNumber) {
        const { textarea, text, start, end, lineIdx, line } =
          getSelectedLineContext();
        const cols = parseTableLine(line);
        if (cols.length < 7) return;
        const laneStr = String(laneNumber).padStart(2, "0");
        if (!/^\d+$/.test(cols[3] || "")) return;
        cols[1] = cols[1] || "piano";
        cols[2] = laneStr;
        const newLine = formatTableLine(cols);
        const newText = text.slice(0, start) + newLine + text.slice(end);
        textarea.value = newText;
        textarea.focus();
        textarea.setSelectionRange(start, start + newLine.length);

        // Recompute playback/navigation state based on updated table.
        const parsed = parseInput(textarea.value);
        playbackNotes = normalizeStartTimes(parsed.notes);
        rowLineMap = parsed.rowLineMap;
        noteLineMap = parsed.noteLineMap;
        computeChordStartIndices();
        playState.status = "stopped";
        playState.hasPreloaded = false;
        playState.cursor = {
          lastNoteIdx: null,
          lastChordIdx: null,
          lastLineIdx: null,
          nextStartTime: 0
        };

        const noteIdx = findNoteIdxByLineIdx(lineIdx);
        if (noteIdx !== null) {
          currentNoteIdx = noteIdx;
          if (document.getElementById("chordMode").checked)
            currentChordIdx = chordIdxForNoteIdx(noteIdx) ?? currentChordIdx;
        }
        updateNavButtons();
        updateMetadataAndHeader();
        renderLaneUIForSelectedLine();
      }

      function parseGameNotesFromTextarea() {
        const textarea = document.getElementById("noteInput");
        const lines = textarea.value.split(/\r?\n/);
        const notes = [];
        for (let i = 0; i < lines.length; i++) {
          const cols = lines[i]
            .replace(/^\||\|$/g, "")
            .split("|")
            .map((s) => s.trim());
          if (cols.length < 9) continue;
          // Expected format: | track | instrument | lane | midi | name | vel | dur | time | spawn |
          const lane = parseInt(cols[2] || "0", 10);
          if (!Number.isFinite(lane) || lane === 0) continue;
          const midi = parseInt(cols[3] || "", 10);
          if (!Number.isFinite(midi)) continue;
          const time = parseFloat(cols[7]);
          const spawn = parseFloat(cols[8]);
          if (!Number.isFinite(time) || !Number.isFinite(spawn) || spawn <= 0)
            continue;
          notes.push({ lane, midi, time, spawn });
        }
        return notes;
      }

      function getCurrentSongTime() {
        if (playState.status === "playing")
          return playback.getCurrentPlaybackTime();
        if (playState.status === "paused")
          return playback.getCurrentPlaybackTime();
        const mode = getMode();
        if (mode === "chord")
          return getStartTimeForChordIndex(Math.max(0, currentChordIdx));
        return getStartTimeForNoteIndex(Math.max(0, currentNoteIdx));
      }

      function startGameRenderLoop() {
        const canvas = document.getElementById("gameCanvas");
        if (!canvas) return;
        const ctx = canvas.getContext("2d");
        if (!ctx) return;

        const resize = () => {
          // Treat CSS size as authoritative.
          const rect = canvas.getBoundingClientRect();
          const dpr = window.devicePixelRatio || 1;
          const newW = Math.max(1, Math.floor(rect.width * dpr));
          const newH = Math.max(1, Math.floor(rect.height * dpr));
          if (canvas.width !== newW || canvas.height !== newH) {
            canvas.width = newW;
            canvas.height = newH;
          }
        };

        let cachedNotes = [];
        let cachedText = null;
        const tick = () => {
          resize();
          const text = document.getElementById("noteInput").value;
          if (text !== cachedText) {
            cachedText = text;
            cachedNotes = parseGameNotesFromTextarea();
          }
          const nowSeconds = getCurrentSongTime();
          drawGameFrame(ctx, canvas, cachedNotes, nowSeconds, {
            laneDescriptor
          });
          requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
        window.addEventListener("resize", resize);
      }

      function renderLanePreview(lane) {
        const preview = document.getElementById("lanePreview");
        const info = document.getElementById("laneInfo");
        if (!preview || !info) return;
        preview.innerHTML = "";
        const desc = laneDescriptor(lane);
        info.textContent = desc.label;
        if (!desc.from || !desc.to) return;

        const dotFrom = document.createElement("div");
        dotFrom.className = "previewDot";
        dotFrom.style.left = desc.from.x + "%";
        dotFrom.style.top = desc.from.y + "%";
        dotFrom.style.background = desc.color;
        dotFrom.classList.add("previewStart");
        preview.appendChild(dotFrom);

        const dotTo = document.createElement("div");
        dotTo.className = "previewDot";
        dotTo.style.left = desc.to.x + "%";
        dotTo.style.top = desc.to.y + "%";
        dotTo.style.background = desc.color;
        dotTo.classList.add("previewTarget");
        preview.appendChild(dotTo);
      }

      function renderLanePreviewForPlayingLine(line) {
        const lane = getLaneFromLine(line);
        const preview = document.getElementById("lanePreview");
        const info = document.getElementById("laneInfo");
        if (!preview || !info) return;
        renderLanePreview(lane);
        const desc = laneDescriptor(lane);
        info.innerHTML = `<strong>Playing:</strong> ${desc.label}`;

      function buildLaneButtons() {
        const container = document.getElementById("laneButtons");
        if (!container) return;
        container.innerHTML = "";
        const defs = [
          // Row 1: 11, 12, 31, 32
          { lane: 11, label: "11", cls: "up" },
          { lane: 12, label: "12", cls: "up" },
          { lane: 31, label: "31", cls: "right" },
          { lane: 32, label: "32", cls: "right" },
          // Row 2: 21, 22, 41, 42
          { lane: 21, label: "21", cls: "left" },
          { lane: 22, label: "22", cls: "left" },
          { lane: 41, label: "41", cls: "down" },
          { lane: 42, label: "42", cls: "down" },
          // Row 3: 51, 52, 53, 54
          { lane: 51, label: "51", cls: "mid" },
          { lane: 52, label: "52", cls: "mid" },
          { lane: 53, label: "53", cls: "mid" },
          { lane: 54, label: "54", cls: "mid" },
          // Row 4: 00 spans all columns
          { lane: 0, label: "00 (clear)", cls: "none wide" }
        ];
        for (const d of defs) {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = `laneBtn ${d.cls}`;
          btn.textContent = d.label;
          btn.dataset.lane = String(d.lane);
          btn.addEventListener("click", () => setSelectedRowLane(d.lane));
          container.appendChild(btn);
        }
      }

      function renderLaneUIForSelectedLine() {
        const { line } = getSelectedLineContext();
        const lane = getLaneFromLine(line);
        renderLanePreview(lane);
        const container = document.getElementById("laneButtons");
        if (!container) return;
        for (const btn of container.querySelectorAll("button[data-lane]")) {
          const isActive = parseInt(btn.dataset.lane, 10) === lane;
          btn.classList.toggle("active", isActive);
        }
      }

      function clamp(x, lo, hi) {
        return Math.max(lo, Math.min(hi, x));
      }

      function getLineBoundsFromCharIndex(text, charIndex) {
        const start = text.lastIndexOf("\n", Math.max(0, charIndex - 1)) + 1;
        let end = text.indexOf("\n", charIndex);
        if (end === -1) end = text.length;
        return { start, end };
      }

      function getLineIndexFromCharIndex(text, charIndex) {
        if (charIndex <= 0) return 0;
        return text.slice(0, charIndex).split("\n").length - 1;
      }

      function scrollTextareaToLine(textarea, lineIdx) {
        const textareaHeight = textarea.clientHeight;
        const style = window.getComputedStyle(textarea);
        const lineHeight = parseFloat(style.lineHeight);
        let effectiveLineHeight = Number.isFinite(lineHeight)
          ? lineHeight
          : NaN;
        if (!Number.isFinite(effectiveLineHeight)) {
          const lineCount = Math.max(1, textarea.value.split("\n").length);
          effectiveLineHeight = textarea.scrollHeight / lineCount;
        }
        // Include padding to avoid drift over time.
        const padTop = parseFloat(style.paddingTop) || 0;
        const padBottom = parseFloat(style.paddingBottom) || 0;
        const innerHeight = Math.max(1, textareaHeight - padTop - padBottom);
        const target = Math.max(
          0,
          padTop + lineIdx * effectiveLineHeight - innerHeight / 2
        );
        const maxScroll = Math.max(0, textarea.scrollHeight - textareaHeight);
        textarea.scrollTop = clamp(target, 0, maxScroll);
      }

      function findNoteIdxByLineIdx(lineIdx) {
        if (!noteLineMap.length) return null;
        const idx = noteLineMap.findIndex((li) => li === lineIdx);
        return idx === -1 ? null : idx;
      }

      function chordIdxForNoteIdx(noteIdx) {
        if (!chordStartIndices.length || noteIdx === null) return null;
        // Find greatest chordStartIndices[i] <= noteIdx
        let lo = 0,
          hi = chordStartIndices.length - 1,
          ans = 0;
        while (lo <= hi) {
          const mid = (lo + hi) >> 1;
          if (chordStartIndices[mid] <= noteIdx) {
            ans = mid;
            lo = mid + 1;
          } else {
            hi = mid - 1;
          }
        }
        return ans;
      }

      function ensureParsedFromTextarea() {
        const textarea = document.getElementById("noteInput");
        const text = textarea.value;
        const parsed = parseInput(text);
        playbackNotes = normalizeStartTimes(parsed.notes);
        rowLineMap = parsed.rowLineMap;
        noteLineMap = parsed.noteLineMap;
        computeChordStartIndices();
        return { textarea, text };
      }

      function syncSelectionToRowAndState(play = false) {
        if (isSnappingSelection) return;
        const textarea = document.getElementById("noteInput");
        const text = textarea.value;
        if (!text) return;
        if (!noteLineMap.length) ensureParsedFromTextarea();
        const shouldAutoSelect = document.getElementById("autoSelect").checked;
        const shouldAutoScroll = document.getElementById("autoScroll").checked;
        const selStart = textarea.selectionStart ?? 0;
        const selEnd = textarea.selectionEnd ?? 0;

        // Exception: if user selected all text, don't snap.
        if (selStart === 0 && selEnd === text.length) return;
        if (selStart === selEnd) {
          const bounds = getLineBoundsFromCharIndex(text, selStart);
          const lineIdx = getLineIndexFromCharIndex(text, bounds.start);
          if (shouldAutoSelect) {
            // Caret move: snap to whole row selection.
            isSnappingSelection = true;
            textarea.setSelectionRange(bounds.start, bounds.end);
            isSnappingSelection = false;
          }
          if (shouldAutoScroll) scrollTextareaToLine(textarea, lineIdx);
          const noteIdx = findNoteIdxByLineIdx(lineIdx);
          if (noteIdx !== null) {
            currentNoteIdx = noteIdx;
            if (document.getElementById("chordMode").checked) {
              currentChordIdx = chordIdxForNoteIdx(noteIdx) ?? currentChordIdx;
            }
            updateMetadataAndHeader();
            updateNavButtons();
            if (play) {
              if (shouldAutoSelect) {
                selectNoteAt(
                  noteIdx,
                  true,
                  document.getElementById("chordMode").checked
                );
              } else {
                playSelectionPing(
                  noteIdx,
                  document.getElementById("chordMode").checked
                );
              }
            }
          }
          if (noteIdx !== null) renderCurrentRowStatus(currentNoteIdx);
          renderLaneUIForSelectedLine();
          return;
        }

        const { start, end } = getLineBoundsFromCharIndex(text, selStart);
        if (shouldAutoSelect) {
          if (start === selStart && end === selEnd) {
            // Already whole-line selected.
          } else {
            isSnappingSelection = true;
            textarea.setSelectionRange(start, end);
            isSnappingSelection = false;
          }
        }

        const lineIdx = getLineIndexFromCharIndex(text, start);
        if (shouldAutoScroll) scrollTextareaToLine(textarea, lineIdx);
        const noteIdx = findNoteIdxByLineIdx(lineIdx);
        if (noteIdx === null) {
          renderLaneUIForSelectedLine();
          return;
        }

        currentNoteIdx = noteIdx;
        if (document.getElementById("chordMode").checked) {
          currentChordIdx = chordIdxForNoteIdx(noteIdx) ?? currentChordIdx;
        }
        updateMetadataAndHeader();
        updateNavButtons();

        // Keep playback cursor aligned so Play starts from this selection when not paused.
        if (playState.status !== "paused") {
          const mode = getMode();
          playState.cursor.lastNoteIdx = null;
          playState.cursor.lastChordIdx = null;
          playState.cursor.lastLineIdx = lineIdx;
          playState.cursor.nextStartTime =
            mode === "chord"
              ? getStartTimeForChordIndex(currentChordIdx)
              : getStartTimeForNoteIndex(currentNoteIdx);
        } else {
          // If user changes selection while paused, next Play should start from selection.
          playState.seekWhilePaused = true;
        }

        if (play) {
          if (shouldAutoSelect) {
            selectNoteAt(
              noteIdx,
              true,
              document.getElementById("chordMode").checked
            );
          } else {
            playSelectionPing(
              noteIdx,
              document.getElementById("chordMode").checked
            );
          }
        }

        renderCurrentRowStatus(currentNoteIdx);
        renderLaneUIForSelectedLine();
      }

      document.getElementById("sortBtn").addEventListener("click", () => {
        const textarea = document.getElementById("noteInput");
        const sorted = sortAndFormatNotesTable(textarea.value);
        textarea.value = sorted;
        pausePlayback();
        playback.clearScheduledTimeouts();
        playState.status = "stopped";
        playState.hasPreloaded = false;
        playState.cursor = {
          lastNoteIdx: null,
          lastChordIdx: null,
          lastLineIdx: null,
          nextStartTime: 0
        };

        ensureParsedFromTextarea();

        // Re-anchor current position to the currently selected line after reorder.
        const caret = textarea.selectionStart ?? 0;
        const { start } = getLineBoundsFromCharIndex(textarea.value, caret);
        const lineIdx = getLineIndexFromCharIndex(textarea.value, start);
        const noteIdx = findNoteIdxByLineIdx(lineIdx);
        if (noteIdx !== null) {
          currentNoteIdx = noteIdx;
          if (document.getElementById("chordMode").checked) {
            currentChordIdx = chordIdxForNoteIdx(noteIdx) ?? currentChordIdx;
          }
        } else {
          currentNoteIdx = 0;
          currentChordIdx = 0;
        }

        updateMetadataAndHeader();
        updateNavButtons();
        updateOctaveButtons();
        renderLaneUIForSelectedLine();
      });

      document
        .getElementById("insertNotesBtn")
        .addEventListener("click", async () => {
          const textarea = document.getElementById("noteInput");
          pausePlayback();
          playback.clearScheduledTimeouts();
          const lines = textarea.value.split(/\r?\n/);
          const assignLanes = [51, 52, 53, 54];
          let assignIdx = 0;
          const newLines = lines.map((line) => {
            const cols = line
              .replace(/^\||\|$/g, "")
              .split("|")
              .map((s) => s.trim());
            if (cols.length < 4) return line;
            // Only assign if lane is 00
            if (cols[2] === "00") {
              cols[2] = String(assignLanes[assignIdx % assignLanes.length]);
              assignIdx++;
              return "| " + cols.join(" | ") + " |";
            }
            return line;
          });
          textarea.value = newLines.join("\n");
          // Recompute playback/navigation state based on updated table.
          const parsed = parseInput(textarea.value);
          playbackNotes = normalizeStartTimes(parsed.notes);
          rowLineMap = parsed.rowLineMap;
          noteLineMap = parsed.noteLineMap;
          computeChordStartIndices();
          playState.status = "stopped";
          playState.hasPreloaded = false;
          playState.cursor = {
            lastNoteIdx: null,
            lastChordIdx: null,
            lastLineIdx: null,
            nextStartTime: 0
          };
          currentNoteIdx = 0;
          currentChordIdx = 0;
          updateNavButtons();
          updateMetadataAndHeader();
          updateOctaveButtons();
          renderLaneUIForSelectedLine();
        });

      document
        .getElementById("clearNotesBtn")
        .addEventListener("click", async () => {
          const textarea = document.getElementById("noteInput");
          pausePlayback();
          playback.clearScheduledTimeouts();
          textarea.value = clearInsertedNotes(textarea.value);

          const parsed = parseInput(textarea.value);
          playbackNotes = normalizeStartTimes(parsed.notes);
          rowLineMap = parsed.rowLineMap;
          noteLineMap = parsed.noteLineMap;
          computeChordStartIndices();
          playState.status = "stopped";
          playState.hasPreloaded = false;
          playState.cursor = {
            lastNoteIdx: null,
            lastChordIdx: null,
            lastLineIdx: null,
            nextStartTime: 0
          };
          currentNoteIdx = 0;
          currentChordIdx = 0;
          updateNavButtons();
          updateMetadataAndHeader();
          updateOctaveButtons();
          renderLaneUIForSelectedLine();
        });

      async function playSelectionPing(idx, chordMode) {
        if (!playbackNotes.length) return;
        await playback.waitForSamples();
        await window.Tone.start();
        if (chordMode) {
          const chordTime = playbackNotes[idx].start;
          const chordNotes = playbackNotes.filter((n) => n.start === chordTime);
          for (const note of chordNotes) {
            await playNoteCompat(note);
          }
        } else {
          await playNoteCompat(playbackNotes[idx]);
        }
      }

      async function goToNextPrev(direction, forcePlay = false) {
        if (!noteLineMap.length) return;
        if (!playbackNotes.length) {
          ensureParsedFromTextarea();
        }

        const chordMode = document.getElementById("chordMode").checked;
        const shouldPlay =
          forcePlay || document.getElementById("autoPlay").checked;
        if (chordMode && chordStartIndices.length > 0) {
          const nextChordIdx = currentChordIdx + direction;
          if (nextChordIdx < 0 || nextChordIdx >= chordStartIndices.length)
            return;
          currentChordIdx = nextChordIdx;
          const noteIdx = chordStartIndices[currentChordIdx];
          await selectNoteAt(noteIdx, false, true);
          if (playState.status === "paused") playState.seekWhilePaused = true;
          if (shouldPlay) await playSelectionPing(noteIdx, true);
        } else {
          const nextNoteIdx = currentNoteIdx + direction;
          if (nextNoteIdx < 0 || nextNoteIdx >= noteLineMap.length) return;
          await selectNoteAt(nextNoteIdx, false, false);
          if (playState.status === "paused") playState.seekWhilePaused = true;
          if (shouldPlay) await playSelectionPing(nextNoteIdx, false);
        }
      }

      document.getElementById("nextBtn").addEventListener("click", async () => {
        await goToNextPrev(1);
      });
      document.getElementById("prevBtn").addEventListener("click", async () => {
        await goToNextPrev(-1);
      });

      // Update metadata and header on load
      function computeChordStartIndices() {
        chordStartIndices = [];
        chordIndexByStartNoteIdx = new Map();
        if (!playbackNotes.length) return;
        let lastStart = null;
        for (let i = 0; i < playbackNotes.length; ++i) {
          if (playbackNotes[i].start !== lastStart) {
            const chordIdx = chordStartIndices.length;
            chordStartIndices.push(i);
            chordIndexByStartNoteIdx.set(i, chordIdx);
            lastStart = playbackNotes[i].start;
          }
        }
      }

      function populateInstrumentDropdown() {
        const INSTRUMENTS = [
          "bass-electric",
          "bassoon",
          "cello",
          "clarinet",
          "contrabass",
          "flute",
          "french-horn",
          "guitar-acoustic",
          "guitar-electric",
          "guitar-nylon",
          "harmonium",
          "harp",
          "organ",
          "piano",
          "saxophone",
          "trombone",
          "trumpet",
          "tuba",
          "violin",
          "xylophone"
        ];

        const sel = document.getElementById("instrumentSelect");
        sel.innerHTML = "";
        for (const name of INSTRUMENTS) {
          const opt = document.createElement("option");
          opt.value = name;
          opt.textContent = name;
          sel.appendChild(opt);
          sel.value = "piano";
        }
      }

      window.addEventListener("DOMContentLoaded", () => {
        updateMetadataAndHeader();
        buildLaneButtons();
        renderLaneUIForSelectedLine();
        startGameRenderLoop();
        populateInstrumentDropdown();
        updateEffectValueLabels();
        playback.applyPreviewEffects(getPlaybackEffectsForCurrentSong());

        const effectInputIds = [
          "release",
          "reverbDecay",
          "reverbWet",
          "delayTime",
          "delayFeedback",
          "delayWet",
          "high",
          "mid",
          "low",
          "lowpassFrequency",
          "chorusDepth",
          "distortionAmount"
        ];
        const effectCheckIds = [
          "fxReleaseEnabled",
          "fxReverbEnabled",
          "fxReverbWetEnabled",
          "fxDelayEnabled",
          "fxDelayFeedbackEnabled",
          "fxDelayWetEnabled",
          "fxEqEnabled",
          "fxEqMidEnabled",
          "fxEqLowEnabled",
          "fxLowpassEnabled",
          "fxChorusEnabled",
          "fxDistortionEnabled"
        ];
        for (const id of effectInputIds) {
          const el = document.getElementById(id);
          if (!el) continue;
          el.addEventListener("input", () => {
            updateEffectValueLabels();
            playback.applyPreviewEffects(getPlaybackEffectsForCurrentSong());
          });
        }
        for (const id of effectCheckIds) {
          const el = document.getElementById(id);
          if (!el) continue;
          el.addEventListener("change", () => {
            playback.applyPreviewEffects(getPlaybackEffectsForCurrentSong());
          });
        }
        document
          .getElementById("enablePlaybackEffects")
          ?.addEventListener("change", () => {
            playback.applyPreviewEffects(getPlaybackEffectsForCurrentSong());
          });
        for (const btn of document.querySelectorAll(".fx-step-btn")) {
          btn.addEventListener("click", () => {
            const targetId = btn.getAttribute("data-target");
            const dir = Number(btn.getAttribute("data-dir") || 0);
            const slider = targetId ? document.getElementById(targetId) : null;
            if (!slider || slider.tagName !== "INPUT") return;
            if (dir > 0) slider.stepUp(1);
            if (dir < 0) slider.stepDown(1);
            slider.dispatchEvent(new Event("input", { bubbles: true }));
          });
        }
        document
          .getElementById("insertEffectsBtn")
          ?.addEventListener("click", () => {
            insertEffectsAtCursor();
          });
        document
          .getElementById("resetEffectsBtn")
          ?.addEventListener("click", () => {
            resetEffectsControls();
          });

        const textarea = document.getElementById("noteInput");
        let lastSelStart = textarea.selectionStart ?? 0;
        let lastSelEnd = textarea.selectionEnd ?? 0;
        const runIfSelectionChanged = () => {
          const s = textarea.selectionStart ?? 0;
          const e = textarea.selectionEnd ?? 0;
          if (s === lastSelStart && e === lastSelEnd) return;
          lastSelStart = s;
          lastSelEnd = e;
          const shouldPlay =
            document.getElementById("autoPlay").checked &&
            performance.now() >= suppressSelectionAutoPlayUntilTs;
          syncSelectionToRowAndState(shouldPlay);
        };
        textarea.addEventListener("select", () =>
          syncSelectionToRowAndState(false)
        );
        textarea.addEventListener("mouseup", () =>
          setTimeout(runIfSelectionChanged, 0)
        );
        textarea.addEventListener("keyup", () =>
          setTimeout(runIfSelectionChanged, 0)
        );
        textarea.addEventListener("keydown", async (e) => {
          if (!document.getElementById("autoScroll").checked) return;
          if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
          e.preventDefault();
          suppressSelectionAutoPlayUntilTs = performance.now() + 180;
          const direction = e.key === "ArrowDown" ? 1 : -1;
          await goToNextPrev(direction, true);
        });
        document
          .getElementById("applyInstrumentBtn")
          .addEventListener("click", applyInstrumentToTrack);

        // Parse notes and set up navigation state
        const text = document.getElementById("noteInput").value;
        const parsed = parseInput(text);
        playbackNotes = normalizeStartTimes(parsed.notes);
        rowLineMap = parsed.rowLineMap;
        noteLineMap = parsed.noteLineMap;
        computeChordStartIndices();
        if (playbackNotes.length > 0) {
          currentNoteIdx = -1;
          currentChordIdx = -1;
          updateNavButtons();
        }
      });

      // Playback logic
      function getMode() {
        return document.getElementById("chordMode").checked ? "chord" : "note";
      }

      function getStartTimeForChordIndex(chordIdx) {
        if (!chordStartIndices.length) return 0;
        chordIdx = Math.max(
          0,
          Math.min(chordStartIndices.length - 1, chordIdx)
        );
        const noteIdx = chordStartIndices[chordIdx];
        return playbackNotes[noteIdx]?.start ?? 0;
      }

      function getStartTimeForNoteIndex(noteIdx) {
        if (!playbackNotes.length) return 0;
        noteIdx = Math.max(0, Math.min(playbackNotes.length - 1, noteIdx));
        return playbackNotes[noteIdx]?.start ?? 0;
      }

      function computeNextStartTimeAfter(lastNoteIdx, mode) {
        if (!playbackNotes.length) return 0;
        if (lastNoteIdx === null || lastNoteIdx === undefined) return 0;

        if (mode === "chord") {
          const lastChordIdx = chordIndexByStartNoteIdx.get(lastNoteIdx);
          if (lastChordIdx === undefined)
            return getStartTimeForNoteIndex(lastNoteIdx);
          if (lastChordIdx >= chordStartIndices.length - 1) return Infinity;
          return getStartTimeForChordIndex(lastChordIdx + 1);
        }

        if (lastNoteIdx >= playbackNotes.length - 1) return Infinity;
        return getStartTimeForNoteIndex(lastNoteIdx + 1);
      }

      function syncPlaybackCursorToStart(startTime, mode) {
        if (mode === "chord" && chordStartIndices.length > 0) {
          const chordIdx = chordStartIndices.findIndex(
            (i) => playbackNotes[i]?.start === startTime
          );
          if (chordIdx !== -1) {
            currentChordIdx = chordIdx;
            currentNoteIdx = chordStartIndices[chordIdx];
          }
          return;
        }
        if (mode === "note" && playbackNotes.length > 0) {
          const noteIdx = playbackNotes.findIndex((n) => n.start === startTime);
          if (noteIdx !== -1) currentNoteIdx = noteIdx;
        }
      }

      function syncPlaybackSelection(mode) {
        const shouldAutoSelect = document.getElementById("autoSelect").checked;
        const shouldAutoScroll = document.getElementById("autoScroll").checked;
        if (!noteLineMap.length || currentNoteIdx < 0) return;
        if (shouldAutoSelect) {
          selectNoteAt(currentNoteIdx, false, mode === "chord");
          return;
        }
        if (shouldAutoScroll) {
          const textarea = document.getElementById("noteInput");
          const lineIdx = noteLineMap[currentNoteIdx];
          scrollTextareaToLine(textarea, lineIdx);
        }
      }

      function handlePlaybackTick(note, mode) {
        renderCurrentRowStatus(note.idx);

        currentNoteIdx = note.idx;
        const chordIdx2 = chordIndexByStartNoteIdx.get(note.idx);
        if (mode === "chord" && chordIdx2 !== undefined) {
          currentChordIdx = chordIdx2;
        }

        playState.cursor.lastNoteIdx = note.idx;
        playState.cursor.lastChordIdx = chordIdx2 ?? null;
        playState.cursor.lastLineIdx = note.lineIdx ?? null;
        playState.cursor.nextStartTime = computeNextStartTimeAfter(
          note.idx,
          mode
        );
        updateMetadataAndHeader();
        updateNavButtons();
        renderLanePreviewForPlayingLine(note.raw);
        const ap = document.getElementById("autoPlay").checked;
        const as = document.getElementById("autoSelect").checked;
        const ascroll = document.getElementById("autoScroll").checked;
        if (ap) {
          if (as) {
            selectNoteAt(note.idx, false, mode === "chord");
          } else if (ascroll) {
            const textarea = document.getElementById("noteInput");
            scrollTextareaToLine(textarea, note.lineIdx);
          }
        }
      }

      function schedulePlaybackAutoPause(startTime) {
        if (playbackNotes.length === 0) return;
        const lastEnd = Math.max(...playbackNotes.map((n) => n.start + n.duration));
        setTimeout(
          () => {
            if (
              playState.status === "playing" &&
              playback.getCurrentPlaybackTime() >= lastEnd - 0.01
            ) {
              pausePlayback();
              playState.cursor.nextStartTime = 0;
            }
          },
          (lastEnd - startTime) * 1000 + 100
        );
      }

      function startPlayback(startTime) {
        const mode = getMode();
        const statusMode = mode === "note" ? "note" : "chord";

        syncPlaybackCursorToStart(startTime, mode);
        updateMetadataAndHeader();
        updateNavButtons();
        syncPlaybackSelection(mode);

        playback.playNotesFrom(
          startTime,
          playbackNotes,
          (note) => handlePlaybackTick(note, mode),
          { statusMode }
        );

        playState.status = "playing";
        document.getElementById("playBtn").textContent = "⏸";
        schedulePlaybackAutoPause(startTime);
      }

      function pausePlayback() {
        if (playState.status !== "playing") return;
        playback.pausePlayback();
        playState.status = "paused";
        playState.seekWhilePaused = false;
        // Resume should start at the next chord/note boundary (computed during playback).
        if (!Number.isFinite(playState.cursor.nextStartTime))
          playState.cursor.nextStartTime = 0;
        document.getElementById("playBtn").textContent = "⏵";
        // Leave the last played chord/note selected when pausing.
        if (
          document.getElementById("autoSelect").checked &&
          playState.cursor.lastNoteIdx !== null &&
          playState.cursor.lastNoteIdx !== undefined
        ) {
          selectNoteAt(
            playState.cursor.lastNoteIdx,
            false,
            document.getElementById("chordMode").checked
          );
        }
        renderLaneUIForSelectedLine();
      }

      document.getElementById("playBtn").addEventListener("click", async () => {
        if (playState.status !== "playing") {
          // Start or resume
          if (!playbackNotes.length) {
            const text = document.getElementById("noteInput").value;
            const parsed = parseInput(text);
            playbackNotes = normalizeStartTimes(parsed.notes);
            rowLineMap = parsed.rowLineMap;
            noteLineMap = parsed.noteLineMap;
            computeChordStartIndices();
            if (playbackNotes.length === 0) {
              alert("No valid notes found.");
              return;
            }
            playState.status = "stopped";
            playState.hasPreloaded = false;
            playState.cursor = {
              lastNoteIdx: null,
              lastChordIdx: null,
              lastLineIdx: null,
              nextStartTime: 0
            };
            currentNoteIdx = 0;
            currentChordIdx = 0;
            updateMetadataAndHeader();
            updateNavButtons();
          }
          // Preload samples once per parsed song to avoid audible artifacts on resume.
          if (!playState.hasPreloaded) {
            playback.applyPreviewEffects(getPlaybackEffectsForCurrentSong());
            document.getElementById("playBtn").textContent = "⏳";
            await playback.preloadNotes(playbackNotes);
            // Add a short delay to ensure all buffers are ready
            await new Promise((res) => setTimeout(res, 300));
            playState.hasPreloaded = true;
          }
          const mode = getMode();
          let startTime = 0;
          if (playState.status === "paused" && !playState.seekWhilePaused) {
            const next = playState.cursor.nextStartTime;
            if (next === Infinity) {
              playState.status = "stopped";
              playState.cursor.nextStartTime = 0;
              startTime = 0;
            } else {
              startTime = next ?? 0;
            }
          } else if (mode === "chord" && chordStartIndices.length > 0) {
            const startChordIdx = Math.max(0, currentChordIdx);
            startTime = getStartTimeForChordIndex(startChordIdx);
          } else {
            startTime = getStartTimeForNoteIndex(Math.max(0, currentNoteIdx));
          }
          playState.seekWhilePaused = false;
          startPlayback(startTime);
        } else {
          // Pause
          pausePlayback();
        }
      });

      document
        .getElementById("beginBtn")
        .addEventListener("click", async () => {
          ensureParsedFromTextarea();
          if (!noteLineMap.length) return;
          const chordMode = document.getElementById("chordMode").checked;
          pausePlayback();
          if (chordMode && chordStartIndices.length > 0) {
            currentChordIdx = 0;
            await selectNoteAt(chordStartIndices[0], false, true);
            if (playState.status === "paused") playState.seekWhilePaused = true;
            if (document.getElementById("autoPlay").checked)
              await playSelectionPing(chordStartIndices[0], true);
          } else {
            currentNoteIdx = 0;
            await selectNoteAt(0, false, false);
            if (playState.status === "paused") playState.seekWhilePaused = true;
            if (document.getElementById("autoPlay").checked)
              await playSelectionPing(0, false);
          }
        });

      document.getElementById("endBtn").addEventListener("click", async () => {
        ensureParsedFromTextarea();
        if (!noteLineMap.length) return;
        const chordMode = document.getElementById("chordMode").checked;
        pausePlayback();
        if (chordMode && chordStartIndices.length > 0) {
          currentChordIdx = chordStartIndices.length - 1;
          const idx = chordStartIndices[currentChordIdx];
          await selectNoteAt(idx, false, true);
          if (playState.status === "paused") playState.seekWhilePaused = true;
          if (document.getElementById("autoPlay").checked)
            await playSelectionPing(idx, true);
        } else {
          currentNoteIdx = noteLineMap.length - 1;
          await selectNoteAt(currentNoteIdx, false, false);
          if (playState.status === "paused") playState.seekWhilePaused = true;
          if (document.getElementById("autoPlay").checked)
            await playSelectionPing(currentNoteIdx, false);
        }
      });

      document
        .getElementById("noteInput")
        .addEventListener("input", async (e) => {
          pausePlayback();
          playState.status = "stopped";
          playState.hasPreloaded = false;
          playState.cursor = {
            lastNoteIdx: null,
            lastChordIdx: null,
            lastLineIdx: null,
            nextStartTime: 0
          };
          playback.clearScheduledTimeouts();
          document.getElementById("currentRowStatus").innerHTML = "";

          if (parseDebounceTimer) clearTimeout(parseDebounceTimer);
          parseDebounceTimer = setTimeout(() => {
            ensureParsedFromTextarea();
            // If current indices are invalid, reset to start.
            if (noteLineMap.length === 0) {
              currentNoteIdx = 0;
              currentChordIdx = 0;
            } else {
              currentNoteIdx = clamp(currentNoteIdx, 0, noteLineMap.length - 1);
              currentChordIdx = clamp(
                currentChordIdx,
                0,
                Math.max(0, chordStartIndices.length - 1)
              );
            }
            updateMetadataAndHeader();
            updateNavButtons();
            renderLaneUIForSelectedLine();
          }, 50);
        });
      // Recompute chord indices and update nav buttons when Chord Mode toggled
      document.getElementById("chordMode").addEventListener("change", () => {
        computeChordStartIndices();
        if (document.getElementById("chordMode").checked) {
          // Snap to nearest chord index
          let idx =
            chordStartIndices.find((i) => i >= currentNoteIdx) ??
            chordStartIndices[chordStartIndices.length - 1];
          currentChordIdx = chordStartIndices.indexOf(idx);
          selectNoteAt(idx, false, true);
        } else {
          selectNoteAt(currentNoteIdx, false, false);
        }
        updateNavButtons();
      });
      // On first Next click after load, highlight and play the first chord
      document.getElementById("nextBtn").addEventListener(
        "click",
        async function firstNextHandler(e) {
          if (currentNoteIdx === -1 && noteLineMap.length > 0) {
            await selectNoteAt(0, true);
            e.stopImmediatePropagation();
          }
        },
        true
      );
    </script>
  </body>
</html>
